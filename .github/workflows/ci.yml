name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # onnxruntime-node (arp-guard -> hackmyagent) downloads CUDA
      # binaries in its install script unless told to skip; no test needs them.
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm install

      # arp-guard is an optional dependency, so npm install succeeds when it
      # fails to install and the tests that import it fail later. Fail here
      # instead, naming the package.
      - name: Check optional dependency arp-guard is installed
        run: |
          test -f node_modules/arp-guard/package.json || {
            echo "::error::optional dependency arp-guard was not installed: node_modules/arp-guard/package.json is missing"
            exit 1
          }

      - name: Build
        run: npm run build

      - name: Test (atomic + integration + baseline)
        run: npm test -- --exclude src/e2e/
        timeout-minutes: 5

      - name: Test (E2E — interceptors)
        run: npx vitest run src/e2e/E2E-004 src/e2e/E2E-005 src/e2e/E2E-006
        timeout-minutes: 2

      - name: Test (E2E — live monitors)
        run: npx vitest run src/e2e/E2E-001 src/e2e/E2E-002 src/e2e/E2E-003
        timeout-minutes: 3
